<body>

  <!-- Karaktärsväljare -->
  <div id="char-picker">
    <button class="char-btn active" data-char="godis" aria-label="Välj Godisbacillen">
      <img src="bilder/godisbacillen.png" alt="Godisbacillen">
      <span>Godisbacillen</span>
    </button>
    <button class="char-btn" data-char="karlek" aria-label="Välj Kärleksbacillen">
      <img src="bilder/karleksbacillen.png" alt="Kärleksbacillen">
      <span>Kärleksbacillen</span>
    </button>
  </div>

  <!-- Spelplan -->
  <div id="stage">
    <img id="character-img" src="bilder/godisbacillen.png" alt="Bacillen" draggable="false">
    <!-- Placerade accessoarer läggs hit dynamiskt -->
  </div>

  <!-- Accessoar-panel + spara-knapp -->
  <div id="bottom-bar">
    <div id="accessory-panel">
      <!-- Accessoarerna renderas med JS -->
    </div>
    <button id="save-btn" aria-label="Spara som bild">
      📷
      <span>Spara</span>
    </button>
  </div>

  <!-- Stjärnregn-overlay (visas vid sparande) -->
  <div id="star-rain" aria-hidden="true"></div>

</body>
