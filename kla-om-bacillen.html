  <!-- html2canvas laddas lazy (bara när man trycker Spara) — se skriptet längst ned -->
  <style>
    :root {
      --candy: #7BC142;
      --candy-light: #E5F4D6;
      --love: #FF6B9D;
      --love-light: #FFE5F0;
      --wealth: #D4A017;
      --wealth-light: #FFF8DC;
      --radius: 20px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Fredoka', sans-serif;
      background: #fffdf7;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }

    /* Karaktärsväljare */
    #char-picker {
      display: flex;
      gap: 12px;
      justify-content: center;
      padding: 10px 16px 6px;
      flex-shrink: 0;
    }

    .char-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: white;
      border: 3px solid #e0e0e0;
      border-radius: var(--radius);
      padding: 8px 16px;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.15s;
      font-family: 'Fredoka', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: #555;
    }

    .char-btn img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    .char-btn.active[data-char="godis"] {
      border-color: var(--candy);
      background: var(--candy-light);
      color: #3a7a10;
      transform: scale(1.05);
    }

    .char-btn.active[data-char="karlek"] {
      border-color: var(--love);
      background: var(--love-light);
      color: #aa2060;
      transform: scale(1.05);
    }

    .char-btn.active[data-char="rikedom"] {
      border-color: var(--wealth);
      background: var(--wealth-light);
      color: #7a5800;
      transform: scale(1.05);
    }

    .char-btn.active[data-char="gladje"] {
      border-color: #FFB347;
      background: #FFF1DC;
      color: #8a5a00;
      transform: scale(1.05);
    }

    .char-btn.active[data-char="ret"] {
      border-color: #FFD93D;
      background: #FFFBE0;
      color: #8a7000;
      transform: scale(1.05);
    }

    .char-btn.active[data-char="dans"] {
      border-color: #4ECDC4;
      background: #E0F7F5;
      color: #1f7a73;
      transform: scale(1.05);
    }

    .char-btn:focus-visible { outline: 3px solid var(--candy); outline-offset: 2px; }

    @media (max-width: 420px) {
      #char-picker {
        gap: 6px;
        padding: 8px 8px 4px;
      }
      .char-btn {
        padding: 5px 8px;
        font-size: 11px;
        border-radius: 12px;
      }
      .char-btn img {
        width: 34px;
        height: 34px;
      }
    }

    /* Spelplan */
    #stage {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: white;
      margin: 8px 16px;
      border-radius: var(--radius);
      border: 3px dashed #e0e0e0;
    }

    #character-img {
      height: 80%;
      max-height: 360px;
      width: auto;
      object-fit: contain;
      pointer-events: none;
      draggable: false;
    }

    /* Accessoar-panel + spara-knapp */
    #bottom-bar {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
      padding: 8px 12px 12px;
      flex-shrink: 0;
    }

    #accessory-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      padding: 2px 0;
    }

    .accessory-item {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
      cursor: grab;
      touch-action: none;
      transition: transform 0.15s, border-color 0.15s;
    }

    .accessory-item:active { transform: scale(0.92); }
    .accessory-item img { width: 28px; height: 28px; object-fit: contain; pointer-events: none; }

    /* Spara-knapp */
    #save-btn {
      flex-shrink: 0;
      width: 100%;
      height: 48px;
      background: var(--candy);
      border: none;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-family: 'Fredoka', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: white;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(123,193,66,0.4);
      transition: transform 0.15s;
    }
    #save-btn:active { transform: scale(0.93); }
    #save-btn:focus-visible { outline: 3px solid white; outline-offset: 2px; }
    #save-btn span { font-size: 16px; }

    /* Ghost accessoar (följer fingret vid drag) */
    .ghost {
      position: fixed;
      pointer-events: none;
      z-index: 1000;
      font-size: 96px;
      transform: translate(-50%, -50%);
      opacity: 0.85;
      transition: none;
    }
    .ghost[data-id="sunglasses"] { font-size: 192px; }
    .ghost img { width: 220px; height: 220px; object-fit: contain; pointer-events: none; display: block; }

    /* Placerad accessoar på spelplanen */
    .placed-accessory {
      position: absolute;
      font-size: 96px;
      cursor: grab;
      touch-action: none;
      transform: translate(-50%, -50%);
      transition: opacity 0.2s;
      z-index: 10;
    }
    .placed-accessory[data-id="sunglasses"] { font-size: 192px; }
    .placed-accessory img { width: 220px; height: 220px; object-fit: contain; pointer-events: none; display: block; }

    /* Bananglasögonen extra stora */
    .placed-accessory[data-id="banana-glasses"] img,
    .ghost[data-id="banana-glasses"] img { width: 300px; height: 300px; }

    /* Skor lite mindre — fot-proportionerliga */
    .placed-accessory[data-id^="shoe-"] img,
    .ghost[data-id^="shoe-"] img { width: 150px; height: 150px; }

    .placed-accessory.removing {
      animation: poff 0.3s ease-out forwards;
    }

    /* Markerad accessoar (visar vrid-handtaget) */
    .placed-accessory.selected {
      outline: 3px dashed var(--candy);
      outline-offset: 6px;
      border-radius: 8px;
    }

    /* Vrid-handtag (dra för att snurra) */
    .rotate-handle {
      position: absolute;
      top: 0;
      left: 50%;
      width: 38px;
      height: 38px;
      transform: translate(-50%, -130%);
      background: var(--candy);
      color: #fff;
      border: 3px solid #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: grab;
      touch-action: none;
      z-index: 30;
      box-shadow: 0 3px 8px rgba(0,0,0,0.3);
    }
    .rotate-handle:active { cursor: grabbing; transform: translate(-50%, -130%) scale(0.9); }

    /* Större/mindre-knappar (visas när accessoaren är markerad) */
    .scale-btn {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 36px;
      height: 36px;
      background: #fff;
      border: 3px solid var(--candy);
      color: var(--candy);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      touch-action: none;
      z-index: 30;
      box-shadow: 0 3px 8px rgba(0,0,0,0.3);
    }
    .scale-btn.smaller { transform: translate(-150%, 130%); }
    .scale-btn.bigger  { transform: translate(50%, 130%); }
    .scale-btn:active { filter: brightness(0.92); }

    @keyframes poff {
      0%   { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      60%  { transform: translate(-50%, -50%) scale(1.4); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    }

    /* Stjärnregn */
    #star-rain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2000;
      overflow: hidden;
    }

    .star {
      position: absolute;
      font-size: 32px;
      animation: star-fall 1s ease-in forwards;
      top: -50px;
    }

    @keyframes star-fall {
      from { transform: translateY(0) rotate(0deg); opacity: 1; }
      to   { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    /* Responsiv: lite mer luft på stora skärmar */
    @media (min-width: 600px) {
      #char-picker { padding: 16px 24px 8px; }
      #stage { margin: 10px 32px; }
      #bottom-bar { padding: 10px 32px 20px; }
      .accessory-item { width: 72px; height: 72px; font-size: 36px; }
    }
  </style>
</head>
<body>

  <!-- Karaktärsväljare -->
  <div id="char-picker">

  <!-- Spelplan -->
  <div id="stage">
    <img id="character-img" src="bilder/godisbacillen.png" alt="Bacillen" draggable="false" decoding="async">

  <!-- Accessoar-panel + spara-knapp -->

  <!-- Stjärnregn-overlay (visas vid sparande) -->
  <div id="star-rain" aria-hidden="true"></div>

  <script>
const ACCESSORIES = [
  { id: 'hat',           emoji: '🎩', label: 'Hatt' },
  { id: 'partyhatt',     src: 'bilder/Partyhatt.png', label: 'Partyhatt' },
  { id: 'crown',         emoji: '👑', label: 'Krona' },
  { id: 'sunglasses',    emoji: '🕶️', label: 'Solglasögon' },
  { id: 'banana-glasses',src: 'bilder/Bananglasögonen_ska_användas_om_accessoar_202605222149.png', label: 'Bananglasögon' },
  { id: 'egg-glasses',   src: 'bilder/eggglasogon.png', label: 'Äggglasögon' },
  { id: 'bow',           emoji: '🎀', label: 'Rosett' },
  { id: 'star',          emoji: '⭐', label: 'Stjärna' },
  { id: 'flower',        emoji: '🌸', label: 'Blomma' },
  { id: 'rainbow',       emoji: '🌈', label: 'Regnbåge' },
  { id: 'butterfly',     emoji: '🦋', label: 'Fjäril' },
  { id: 'guitar',        emoji: '🎸', label: 'Gitarr' },
  { id: 'heart',         emoji: '❤️', label: 'Hjärta' },
  { id: 'cap',           emoji: '🧢', label: 'Keps' },
  { id: 'sunhat',        emoji: '👒', label: 'Solhatt' },
  { id: 'wand',          emoji: '🪄', label: 'Trollstav' },
  { id: 'lollipop',      emoji: '🍭', label: 'Klubba' },
  { id: 'balloon',       emoji: '🎈', label: 'Ballong' },
  { id: 'shoe-clown-left',  src: 'bilder/shoe-clown-left.png',  label: 'Clownsko (vänster)' },
  { id: 'shoe-clown-right', src: 'bilder/shoe-clown-right.png', label: 'Clownsko (höger)' },
  { id: 'shoe-red-left',    src: 'bilder/shoe-red-left.png',    label: 'Röd sko (vänster)' },
  { id: 'shoe-red-right',   src: 'bilder/shoe-red-right.png',   label: 'Röd sko (höger)' },
];

const CHARACTERS = {
  godis:   { src: 'bilder/godisbacillen.png',    alt: 'Godisbacillen' },
  karlek:  { src: 'bilder/karleksbacillen.png',  alt: 'Kärleksbacillen' },
  gladje:  { src: 'bilder/gladjebacillen.png',   alt: 'Glädjebacillen' },
  ret:     { src: 'bilder/retbacillen.png',      alt: 'Retbacillen' },
  dans:    { src: 'bilder/dansbacillen.png',     alt: 'Dansbacillen' },
  rikedom: { src: 'bilder/rikedomsbacillen.png', alt: 'Rikedomsbacillen' },
};

let activeChar = 'godis';

function renderAccessoryPanel() {
  const panel = document.getElementById('accessory-panel');
  panel.innerHTML = '';
  ACCESSORIES.forEach(acc => {
    const el = document.createElement('div');
    el.className = 'accessory-item';
    el.dataset.id = acc.id;
    el.setAttribute('aria-label', acc.label);
    el.setAttribute('role', 'button');
    if (acc.src) {
      const img = document.createElement('img');
      img.src = acc.src;
      img.alt = acc.label;
      img.draggable = false;
      el.appendChild(img);
    } else {
      el.dataset.emoji = acc.emoji;
      el.textContent = acc.emoji;
    }
    panel.appendChild(el);
  });
}

renderAccessoryPanel();

function switchCharacter(charKey) {
  if (charKey === activeChar) return;
  activeChar = charKey;

  const img = document.getElementById('character-img');
  img.src = CHARACTERS[charKey].src;
  img.alt = CHARACTERS[charKey].alt;

  document.querySelectorAll('.char-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.char === charKey);
  });

  document.querySelectorAll('.placed-accessory').forEach(el => el.remove());
  deselectAll();
}

document.querySelectorAll('.char-btn').forEach(btn => {
  btn.addEventListener('click', () => switchCharacter(btn.dataset.char));
});

let ghost = null;
let ghostAcc = null;
let draggingPlaced = null;

function createGhost(acc, x, y) {
  ghost = document.createElement('div');
  ghost.className = 'ghost';
  ghost.dataset.id = acc.id;
  if (acc.src) {
    const img = document.createElement('img');
    img.src = acc.src;
    img.alt = acc.label;
    img.draggable = false;
    ghost.appendChild(img);
  } else {
    ghost.textContent = acc.emoji;
  }
  ghost.style.left = x + 'px';
  ghost.style.top = y + 'px';
  document.body.appendChild(ghost);
}

function moveGhost(x, y) {
  if (!ghost) return;
  ghost.style.left = x + 'px';
  ghost.style.top = y + 'px';
}

function removeGhost() {
  if (ghost) { ghost.remove(); ghost = null; }
}

function getClientXY(e) {
  if (e.touches && e.touches.length > 0) {
    return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }
  if (e.changedTouches && e.changedTouches.length > 0) {
    return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
  }
  return { x: e.clientX, y: e.clientY };
}

function isOverStage(x, y) {
  const stage = document.getElementById('stage');
  const rect = stage.getBoundingClientRect();
  return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
}

function placeAccessory(acc, x, y) {
  const stage = document.getElementById('stage');
  const rect = stage.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'placed-accessory';
  el.dataset.id = acc.id;
  if (acc.src) {
    const img = document.createElement('img');
    img.src = acc.src;
    img.alt = acc.label;
    img.draggable = false;
    el.appendChild(img);
  } else {
    el.textContent = acc.emoji;
  }
  el.style.left = (x - rect.left) + 'px';
  el.style.top  = (y - rect.top) + 'px';
  el.dataset.angle = '0';
  el.dataset.scale = '1';
  stage.appendChild(el);
  initPlacedDrag(el);
  initLongPress(el);
  selectAccessory(el);
}

function applyTransform(el) {
  const angle = parseFloat(el.dataset.angle) || 0;
  const scale = parseFloat(el.dataset.scale) || 1;
  el.style.transform = `translate(-50%, -50%) rotate(${angle}deg) scale(${scale})`;
}

function onPanelDragStart(e, itemEl) {
  e.preventDefault();
  const id = itemEl.dataset.id;
  ghostAcc = ACCESSORIES.find(a => a.id === id);
  if (!ghostAcc) return;
  const { x, y } = getClientXY(e);
  requestAnimationFrame(() => {
    createGhost(ghostAcc, x, y);
  });
}

document.getElementById('accessory-panel').addEventListener('mousedown', e => {
  const item = e.target.closest('.accessory-item');
  if (!item) return;
  onPanelDragStart(e, item);
});

document.getElementById('accessory-panel').addEventListener('touchstart', e => {
  const item = e.target.closest('.accessory-item');
  if (!item) return;
  onPanelDragStart(e, item);
}, { passive: false });

document.addEventListener('mousemove', e => {
  moveGhost(e.clientX, e.clientY);
  if (draggingHandle) rotateFromPointer(e.clientX, e.clientY);
  else if (draggingPlaced) movePlaced(e.clientX, e.clientY);
});

document.addEventListener('touchmove', e => {
  e.preventDefault();
  const { x, y } = getClientXY(e);
  moveGhost(x, y);
  if (draggingHandle) rotateFromPointer(x, y);
  else if (draggingPlaced) movePlaced(x, y);
}, { passive: false });

function onDrop(x, y) {
  if (ghost && ghostAcc) {
    if (isOverStage(x, y)) {
      placeAccessory(ghostAcc, x, y);
    }
    removeGhost();
    ghostAcc = null;
  }
  // Tryck (utan att dra) på en placerad accessoar = markera den och visa vrid-handtaget
  if (draggingPlaced && !placedMoved) selectAccessory(draggingPlaced);
  draggingPlaced = null;
  draggingHandle = null;
}

document.addEventListener('mouseup', e => onDrop(e.clientX, e.clientY));
document.addEventListener('touchend', e => {
  const { x, y } = getClientXY(e);
  onDrop(x, y);
});

document.addEventListener('touchcancel', () => {
  removeGhost();
  ghostAcc = null;
  draggingPlaced = null;
  draggingHandle = null;
});

// Tryck på tom spelplan (eller bacillen) avmarkerar och döljer handtaget
['mousedown', 'touchstart'].forEach(evt => {
  document.getElementById('stage').addEventListener(evt, e => {
    if (e.target.id === 'stage' || e.target.id === 'character-img') deselectAll();
  }, { passive: true });
});

let placedOffsetX = 0;
let placedOffsetY = 0;
let longPressTimer = null;
let draggingHandle = null;
let placedDownX = 0;
let placedDownY = 0;
let placedMoved = false;

function initPlacedDrag(el) {
  function startDrag(e) {
    e.preventDefault();
    e.stopPropagation();
    clearTimeout(longPressTimer);
    const { x, y } = getClientXY(e);
    const stage = document.getElementById('stage');
    const stageRect = stage.getBoundingClientRect();
    const elLeft = parseFloat(el.style.left);
    const elTop  = parseFloat(el.style.top);
    placedOffsetX = x - (stageRect.left + elLeft);
    placedOffsetY = y - (stageRect.top  + elTop);
    placedDownX = x;
    placedDownY = y;
    placedMoved = false;
    draggingPlaced = el;
  }

  el.addEventListener('mousedown', startDrag);
  el.addEventListener('touchstart', startDrag, { passive: false });
}

function movePlaced(x, y) {
  if (!draggingPlaced) return;
  if (Math.abs(x - placedDownX) > 6 || Math.abs(y - placedDownY) > 6) placedMoved = true;
  const stage = document.getElementById('stage');
  const rect = stage.getBoundingClientRect();
  const newLeft = x - rect.left - placedOffsetX;
  const newTop  = y - rect.top  - placedOffsetY;
  draggingPlaced.style.left = newLeft + 'px';
  draggingPlaced.style.top  = newTop  + 'px';
}

// --- Markera + vrida ---
function selectAccessory(el) {
  deselectAll();
  el.classList.add('selected');

  const handle = document.createElement('div');
  handle.className = 'rotate-handle';
  handle.textContent = '🔄';
  handle.setAttribute('data-html2canvas-ignore', 'true');
  handle.setAttribute('aria-label', 'Vrid accessoaren');
  el.appendChild(handle);
  initHandleDrag(handle, el);

  const smaller = document.createElement('div');
  smaller.className = 'scale-btn smaller';
  smaller.textContent = '−';
  smaller.setAttribute('data-html2canvas-ignore', 'true');
  smaller.setAttribute('aria-label', 'Gör mindre');
  el.appendChild(smaller);
  initScaleButton(smaller, el, 1 / 1.2);

  const bigger = document.createElement('div');
  bigger.className = 'scale-btn bigger';
  bigger.textContent = '+';
  bigger.setAttribute('data-html2canvas-ignore', 'true');
  bigger.setAttribute('aria-label', 'Gör större');
  el.appendChild(bigger);
  initScaleButton(bigger, el, 1.2);
}

function deselectAll() {
  document.querySelectorAll('.placed-accessory.selected').forEach(el => {
    el.classList.remove('selected');
    el.querySelectorAll('.rotate-handle, .scale-btn').forEach(h => h.remove());
  });
}

function initScaleButton(btn, el, factor) {
  function press(e) {
    e.preventDefault();
    e.stopPropagation();
    clearTimeout(longPressTimer);
    scaleAccessory(el, factor);
  }
  btn.addEventListener('mousedown', press);
  btn.addEventListener('touchstart', press, { passive: false });
}

function scaleAccessory(el, factor) {
  let s = (parseFloat(el.dataset.scale) || 1) * factor;
  s = Math.min(3, Math.max(0.4, s));
  el.dataset.scale = s;
  applyTransform(el);
}

function initHandleDrag(handle, el) {
  function startRotate(e) {
    e.preventDefault();
    e.stopPropagation();
    clearTimeout(longPressTimer);
    draggingHandle = el;
  }
  handle.addEventListener('mousedown', startRotate);
  handle.addEventListener('touchstart', startRotate, { passive: false });
}

function rotateFromPointer(x, y) {
  if (!draggingHandle) return;
  const stage = document.getElementById('stage');
  const rect = stage.getBoundingClientRect();
  const cx = rect.left + parseFloat(draggingHandle.style.left);
  const cy = rect.top  + parseFloat(draggingHandle.style.top);
  // Handtaget sitter rakt ovanför mitten, så +90° gör att det följer fingret runt.
  const deg = Math.atan2(y - cy, x - cx) * 180 / Math.PI + 90;
  draggingHandle.dataset.angle = deg;
  applyTransform(draggingHandle);
}

function removeAccessory(el) {
  if (draggingPlaced === el) draggingPlaced = null;
  el.classList.add('removing');
  el.addEventListener('animationend', () => el.remove(), { once: true });
}

function initLongPress(el) {
  function startLong(e) {
    longPressTimer = setTimeout(() => {
      removeAccessory(el);
    }, 500);
  }
  function cancelLong() {
    clearTimeout(longPressTimer);
  }

  el.addEventListener('mousedown', startLong);
  el.addEventListener('mouseup', cancelLong);
  el.addEventListener('mousemove', cancelLong);
  el.addEventListener('touchstart', startLong, { passive: true });
  el.addEventListener('touchend', cancelLong);
  el.addEventListener('touchmove', cancelLong);
}

function showStarRain() {
  const container = document.getElementById('star-rain');
  container.innerHTML = '';
  const stars = ['⭐','🌟','✨','💫'];
  for (let i = 0; i < 20; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.textContent = stars[i % stars.length];
    star.style.left = Math.random() * 100 + 'vw';
    star.style.animationDelay = Math.random() * 0.6 + 's';
    star.style.fontSize = (24 + Math.random() * 24) + 'px';
    container.appendChild(star);
  }
  setTimeout(() => { container.innerHTML = ''; }, 1800);
}

// html2canvas laddas lazy — inte render-blockerande i <head> — så att tidiga
// tryck (t.ex. karaktärsbyte) inte fördröjs av att skriptet parsas.
let _h2cPromise = null;
function ensureHtml2Canvas() {
  if (window.html2canvas) return Promise.resolve();
  if (_h2cPromise) return _h2cPromise;
  _h2cPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = '/vendor/html2canvas.min.js';  // lokalt hostad (1.4.1, MIT) — inga externa anrop
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return _h2cPromise;
}

// Förladda i bakgrunden när webbläsaren är ledig: html2canvas + alla karaktärsbilder.
// Då blir både Spara och karaktärsbyte direkt, utan att blockera första interaktionen.
function idle(fn, timeout) {
  ('requestIdleCallback' in window) ? requestIdleCallback(fn, { timeout: timeout }) : setTimeout(fn, timeout);
}
idle(() => { ensureHtml2Canvas().catch(() => {}); }, 4000);
idle(() => {
  Object.values(CHARACTERS).forEach(c => { const im = new Image(); im.src = c.src; });
}, 2500);

document.getElementById('save-btn').addEventListener('click', (e) => {
  const btn = e.currentTarget;
  btn.disabled = true;
  deselectAll(); // göm vrid-handtag/markering så de inte hamnar på bilden
  const stage = document.getElementById('stage');
  ensureHtml2Canvas()
    .then(() => html2canvas(stage, {
      backgroundColor: '#ffffff',
      scale: 2,
      useCORS: true,
      allowTaint: false,
    }))
    .then(canvas => {
    const link = document.createElement('a');
    link.download = 'min-bacill.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    showStarRain();
  }).catch(err => {
    console.error('html2canvas misslyckades:', err);
    alert('Kunde inte spara bilden. Prova att ta en skärmdump istället! 📸');
  }).finally(() => {
    btn.disabled = false;
  });
});
