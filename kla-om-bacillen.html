  <style>
    :root {
      --candy: #7BC142;
      --candy-light: #E5F4D6;
      --love: #FF6B9D;
      --love-light: #FFE5F0;
      --radius: 20px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Fredoka', sans-serif;
      background: #fffdf7;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }

    /* Karaktärsväljare */
    #char-picker {
      display: flex;
      gap: 12px;
      justify-content: center;
      padding: 10px 16px 6px;
      flex-shrink: 0;
    }

    .char-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: white;
      border: 3px solid #e0e0e0;
      border-radius: var(--radius);
      padding: 8px 16px;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.15s;
      font-family: 'Fredoka', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: #555;
    }

    .char-btn img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    .char-btn.active[data-char="godis"] {
      border-color: var(--candy);
      background: var(--candy-light);
      color: #3a7a10;
      transform: scale(1.05);
    }

    .char-btn.active[data-char="karlek"] {
      border-color: var(--love);
      background: var(--love-light);
      color: #aa2060;
      transform: scale(1.05);
    }

    /* Spelplan */
    #stage {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: white;
      margin: 8px 16px;
      border-radius: var(--radius);
      border: 3px dashed #e0e0e0;
    }

    #character-img {
      height: 80%;
      max-height: 360px;
      width: auto;
      object-fit: contain;
      pointer-events: none;
      draggable: false;
    }

    /* Accessoar-panel + spara-knapp */
    #bottom-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px 12px;
      flex-shrink: 0;
    }

    #accessory-panel {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      flex: 1;
      padding: 4px 2px 8px;
      scrollbar-width: none;
    }
    #accessory-panel::-webkit-scrollbar { display: none; }

    .accessory-item {
      flex-shrink: 0;
      width: 64px;
      height: 64px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      cursor: grab;
      touch-action: none;
      transition: transform 0.15s, border-color 0.15s;
    }

    .accessory-item:active { transform: scale(0.92); }

    /* Spara-knapp */
    #save-btn {
      flex-shrink: 0;
      width: 72px;
      height: 72px;
      background: var(--candy);
      border: none;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      font-family: 'Fredoka', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: white;
      gap: 2px;
      box-shadow: 0 4px 12px rgba(123,193,66,0.4);
      transition: transform 0.15s;
    }
    #save-btn:active { transform: scale(0.93); }
    #save-btn span { font-size: 11px; }

    /* Ghost accessoar (följer fingret vid drag) */
    .ghost {
      position: fixed;
      pointer-events: none;
      z-index: 1000;
      font-size: 48px;
      transform: translate(-50%, -50%);
      opacity: 0.85;
      transition: none;
    }

    /* Placerad accessoar på spelplanen */
    .placed-accessory {
      position: absolute;
      font-size: 48px;
      cursor: grab;
      touch-action: none;
      transform: translate(-50%, -50%);
      transition: opacity 0.2s;
      z-index: 10;
    }

    .placed-accessory.removing {
      animation: poff 0.3s ease-out forwards;
    }

    @keyframes poff {
      0%   { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      60%  { transform: translate(-50%, -50%) scale(1.4); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    }

    /* Stjärnregn */
    #star-rain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2000;
      overflow: hidden;
    }

    .star {
      position: absolute;
      font-size: 32px;
      animation: star-fall 1s ease-in forwards;
      top: -50px;
    }

    @keyframes star-fall {
      from { transform: translateY(0) rotate(0deg); opacity: 1; }
      to   { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    /* Responsiv: lite mer luft på stora skärmar */
    @media (min-width: 600px) {
      #char-picker { padding: 16px 24px 8px; }
      #stage { margin: 10px 32px; }
      #bottom-bar { padding: 10px 32px 20px; }
      .accessory-item { width: 72px; height: 72px; font-size: 36px; }
    }
  </style>

<body>

  <!-- Karaktärsväljare -->
  <div id="char-picker">
    <button class="char-btn active" data-char="godis" aria-label="Välj Godisbacillen">
      <img src="bilder/godisbacillen.png" alt="Godisbacillen">
      <span>Godisbacillen</span>
    </button>
    <button class="char-btn" data-char="karlek" aria-label="Välj Kärleksbacillen">
      <img src="bilder/karleksbacillen.png" alt="Kärleksbacillen">
      <span>Kärleksbacillen</span>
    </button>
  </div>

  <!-- Spelplan -->
  <div id="stage">
    <img id="character-img" src="bilder/godisbacillen.png" alt="Bacillen" draggable="false">
    <!-- Placerade accessoarer läggs hit dynamiskt -->
  </div>

  <!-- Accessoar-panel + spara-knapp -->
  <div id="bottom-bar">
    <div id="accessory-panel">
      <!-- Accessoarerna renderas med JS -->
    </div>
    <button id="save-btn" aria-label="Spara som bild">
      📷
      <span>Spara</span>
    </button>
  </div>

  <!-- Stjärnregn-overlay (visas vid sparande) -->
  <div id="star-rain" aria-hidden="true"></div>

</body>
