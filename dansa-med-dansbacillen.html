<!DOCTYPE html>
<html lang="sv">
<head>
<script src="/app-mode.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2BA89F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bacillerna">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<title>Dansa med Dansbacillen – Dans challenge för barn | Bacillerna</title>
<meta name="description" content="Snurra hjulet, få en rolig dans och dansa loss med Dansbacillen. När musiken stannar fryser du. Ingen poäng, ingen förlust. Dans challenge för barn 3 till 8 år.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://bacillerna.se/dansa-med-dansbacillen.html" />
<link rel="alternate" hreflang="sv" href="https://bacillerna.se/dansa-med-dansbacillen.html" />
<link rel="alternate" hreflang="en" href="https://luvbugscollection.com/dance-with-disco-bug.html" />
<style>
/* Fredoka (rubriker) + Nunito (brödtext) självhostade lokalt — inga externa
   anrop (Google Play Families). Matchar typografin på bacillerna.se. */
@font-face {
  font-family: 'Fredoka';
  src: url('/fonts/Fredoka-VariableFont.ttf') format('truetype');
  font-weight: 300 700;
  font-display: swap;
}
@font-face {
  font-family: 'Nunito';
  src: url('/fonts/Nunito-VariableFont.ttf') format('truetype');
  font-weight: 400 800;
  font-display: swap;
}

* { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

:root {
  --safe-top:    env(safe-area-inset-top,    0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left:   env(safe-area-inset-left,   0px);
  --safe-right:  env(safe-area-inset-right,  0px);

  /* Karaktärsfärg: turkos (Dansbacillen) */
  --char-color:      #4ECDC4;
  --char-color-deep: #2BA89F;
  --char-color-dark: #1F7A73;
  --coral:  #FF6B6B;
  --yellow: #FFD93D;
  --purple: #B57EDC;

  --font-heading: 'Fredoka', 'Nunito', -apple-system, 'Segoe UI', system-ui, sans-serif;
  --font-body:    'Nunito', -apple-system, 'Segoe UI', system-ui, sans-serif;
}

html, body { height: 100%; }
body {
  font-family: var(--font-body);
  color: #fff;
  height: 100dvh;
  overflow: hidden;
  user-select: none;
  background: #1F7A73;
}

.bg {
  position: fixed; inset: 0; z-index: 0;
  background: linear-gradient(165deg, #6FE3D8 0%, #3FC2B7 46%, #1F8C83 100%);
}
.bg::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 30%, rgba(255,255,255,0.22) 0%, transparent 55%);
}

.screen {
  position: fixed; inset: 0; z-index: 1;
  display: none; flex-direction: column; align-items: center;
  padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
}
.screen.active { display: flex; }

/* ── STARTSIDA ── */
#screen-menu {
  justify-content: center; gap: clamp(10px, 2.4vmin, 20px);
  text-align: center;
  padding-left: max(18px, var(--safe-left));
  padding-right: max(18px, var(--safe-right));
}
.spotlight {
  position: relative; width: clamp(150px, 40vmin, 250px); aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center; border-radius: 50%;
  background: radial-gradient(circle at 50% 46%, rgba(255,255,255,0.34) 0%, rgba(255,255,255,0.10) 46%, transparent 70%);
}
.spotlight img {
  width: 96%; height: 96%; object-fit: contain;
  filter: drop-shadow(0 8px 16px rgba(0,0,0,0.30));
}
#menu-bug { animation: menuBob 2.1s ease-in-out infinite; cursor: pointer; }
@keyframes menuBob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-9px) rotate(2deg); } }
#menu-bug.wave { animation: menuWave 0.6s ease-in-out; }
@keyframes menuWave { 0%,100% { transform: scale(1) rotate(0); } 30% { transform: scale(1.1) rotate(-6deg); } 65% { transform: scale(1.06) rotate(6deg); } }

#screen-menu h1 {
  font-family: var(--font-heading); font-size: clamp(30px, 8vmin, 54px); font-weight: 700; line-height: 1.03;
  color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,0.18), 0 0 22px rgba(255,255,255,0.4);
}
#menu-msg { font-size: clamp(14px, 3.6vmin, 19px); color: #fff; max-width: 340px; line-height: 1.5; font-weight: 500; text-shadow: 0 1px 4px rgba(0,0,0,0.22); }

/* Lägesval */
.mode-row { display: flex; gap: clamp(10px, 3vw, 16px); margin-top: 4px; flex-wrap: wrap; justify-content: center; }
.mode-btn {
  font-family: var(--font-heading); font-weight: 600; border: 3px solid rgba(255,255,255,0.55);
  border-radius: 22px; padding: clamp(10px,2.4vmin,14px) clamp(18px,5vw,26px); cursor: pointer;
  background: rgba(255,255,255,0.14); color: #fff; font-size: clamp(15px, 4vmin, 19px);
  display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 132px;
  transition: transform 0.1s, background 0.15s, border-color 0.15s;
}
.mode-btn .m-sub { font-size: clamp(11px, 2.8vmin, 13px); font-weight: 500; opacity: 0.85; }
.mode-btn.sel { background: #fff; color: var(--char-color-dark); border-color: #fff; box-shadow: 0 6px 0 var(--char-color-deep); }
.mode-btn:active { transform: translateY(2px); }
.mode-btn:focus-visible { outline: 4px solid var(--yellow); outline-offset: 3px; }

.start-btn {
  font-family: var(--font-heading); font-weight: 700; border: none; border-radius: 28px;
  padding: clamp(16px,3.4vmin,22px) clamp(34px,9vw,52px); cursor: pointer; margin-top: 8px;
  font-size: clamp(20px, 5.6vmin, 30px); color: #10302d;
  background: var(--yellow); box-shadow: 0 7px 0 #C9A400, 0 0 28px rgba(255,217,61,0.5);
  transition: transform 0.1s, box-shadow 0.1s;
}
.start-btn:active { transform: translateY(5px); box-shadow: 0 2px 0 #C9A400; }
.start-btn:focus-visible { outline: 4px solid #fff; outline-offset: 4px; }

#menu-more { margin-top: 2px; font-size: clamp(13px, 3.3vmin, 16px); color: #fff; opacity: 0.9; text-decoration: none; padding: 8px 16px; font-weight: 600; text-shadow: 0 1px 4px rgba(0,0,0,0.2); }
#menu-more:hover { opacity: 1; text-decoration: underline; }
#menu-more:focus-visible { outline: 3px solid #fff; outline-offset: 2px; border-radius: 10px; }

/* ── SPELSIDA ── */
#screen-game { justify-content: flex-start; }

#hud {
  width: 100%; display: grid; grid-template-columns: auto 1fr auto;
  align-items: center; gap: 10px; padding: 8px 12px; min-height: 54px; flex-shrink: 0; z-index: 4;
}
.hud-btn {
  font-size: 22px; background: rgba(0,0,0,0.16); border: none; cursor: pointer;
  color: #fff; border-radius: 14px; min-width: 46px; min-height: 46px;
  display: flex; align-items: center; justify-content: center; font-family: var(--font-heading); line-height: 1;
}
.hud-btn:active { background: rgba(0,0,0,0.30); }
.hud-btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

/* Dansmätaren */
#meter { display: flex; flex-direction: column; align-items: center; gap: 4px; }
#meter-label { font-family: var(--font-heading); font-weight: 600; font-size: clamp(11px, 2.8vmin, 14px); color: #fff; opacity: 0.92; letter-spacing: 0.3px; }
#dots { display: flex; gap: clamp(4px, 1.4vw, 8px); }
.dot {
  width: clamp(14px, 3.6vw, 20px); height: clamp(14px, 3.6vw, 20px); border-radius: 50%;
  background: rgba(0,0,0,0.16); box-shadow: inset 0 1px 3px rgba(0,0,0,0.25); transition: transform 0.15s;
}
.dot.filled { background: radial-gradient(circle at 50% 32%, #fff, var(--yellow)); box-shadow: 0 0 12px rgba(255,217,61,0.85); }
.dot.pop { animation: dotPop 0.36s cubic-bezier(0.34,1.56,0.64,1); }
@keyframes dotPop { 0% { transform: scale(0.4); } 60% { transform: scale(1.35); } 100% { transform: scale(1); } }
#stars { display: flex; gap: 2px; min-height: 1.1em; font-size: clamp(13px, 3.2vw, 18px); }
.star.pop { animation: dotPop 0.5s cubic-bezier(0.34,1.56,0.64,1); }

/* Scen med Dansbacillen */
#stage { flex-shrink: 0; display: flex; align-items: center; justify-content: center; padding: clamp(4px,1.4vmin,12px); }
#hero-spot {
  position: relative; width: clamp(120px, 30vmin, 210px); aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle at 50% 46%, rgba(255,255,255,0.30) 0%, rgba(255,255,255,0.08) 48%, transparent 72%);
  display: flex; align-items: center; justify-content: center; will-change: transform;
}
#hero { width: 96%; height: 96%; object-fit: contain; filter: drop-shadow(0 6px 12px rgba(0,0,0,0.28)); }
#hero-spot.dancing { animation: heroDance 0.62s ease-in-out infinite; }
@keyframes heroDance {
  0%   { transform: translateY(0) rotate(-5deg) scale(1); }
  25%  { transform: translateY(-10px) rotate(4deg) scale(1.04); }
  50%  { transform: translateY(0) rotate(5deg) scale(1); }
  75%  { transform: translateY(-8px) rotate(-4deg) scale(1.03); }
  100% { transform: translateY(0) rotate(-5deg) scale(1); }
}
#hero-spot.dancing.calm { animation: heroDanceCalm 1.5s ease-in-out infinite; }
@keyframes heroDanceCalm {
  0%,100% { transform: translateY(0) rotate(-2deg) scale(1); }
  50%     { transform: translateY(-5px) rotate(2deg) scale(1.02); }
}
#hero-spot.frozen { animation: none !important; transform: rotate(-2deg) scale(1); filter: none; }
#hero-spot.frozen #hero { filter: drop-shadow(0 6px 12px rgba(0,0,0,0.28)) brightness(1.04); }

/* Hjul + rörelsekort */
#play-area {
  flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: clamp(10px, 2.6vmin, 22px); position: relative; padding: 0 16px calc(78px + var(--safe-bottom));
}
#wheel-wrap { position: relative; display: flex; align-items: center; justify-content: center; }
.wheel-ring {
  position: absolute; width: clamp(210px, 74vmin, 340px); aspect-ratio: 1; border-radius: 50%;
  border: 7px dashed rgba(255,255,255,0.55); pointer-events: none;
}
.wheel-ring.spin { animation: ringSpin 0.5s linear infinite; }
@keyframes ringSpin { to { transform: rotate(360deg); } }
.wheel-ring.r2 { width: clamp(168px, 60vmin, 280px); border-style: dotted; border-color: rgba(255,255,255,0.35); }
.wheel-ring.r2.spin { animation: ringSpinRev 0.7s linear infinite; }
@keyframes ringSpinRev { to { transform: rotate(-360deg); } }

#wheel-card {
  position: relative; z-index: 2; width: clamp(150px, 52vmin, 230px); aspect-ratio: 1; border-radius: 32px;
  background: rgba(255,255,255,0.96); color: var(--char-color-dark);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  box-shadow: 0 12px 30px rgba(0,0,0,0.28); padding: 12px; text-align: center;
  transition: opacity 0.28s, transform 0.28s;
}
#wheel-card.fade { opacity: 0; transform: scale(0.9); }
#wheel-card.land { animation: cardLand 0.5s cubic-bezier(0.34,1.56,0.64,1); }
@keyframes cardLand { 0% { transform: scale(0.7); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
#card-emoji { font-size: clamp(52px, 17vmin, 104px); line-height: 1; }
#card-name { font-family: var(--font-heading); font-weight: 700; font-size: clamp(16px, 4.4vmin, 24px); }

#instruction {
  text-align: center; font-family: var(--font-heading); font-weight: 600;
  font-size: clamp(17px, 4.6vmin, 26px); color: #fff;
  text-shadow: 0 2px 6px rgba(0,0,0,0.35); min-height: 2.6em; line-height: 1.25;
  max-width: 460px; display: flex; align-items: center; justify-content: center;
}

/* FRYS-overlay */
#freeze {
  position: fixed; inset: 0; z-index: 8; display: none; flex-direction: column;
  align-items: center; justify-content: center; gap: 10px; pointer-events: none;
  background: rgba(31,122,115,0.34);
}
#freeze.show { display: flex; }
#freeze.pop #freeze-txt { animation: freezePop 0.5s cubic-bezier(0.34,1.7,0.5,1); }
#freeze.soft { background: rgba(31,122,115,0.5); }
#freeze.soft #freeze-txt { animation: freezeSoft 0.9s ease-out; }
#freeze-txt {
  font-family: var(--font-heading); font-weight: 700; font-size: clamp(56px, 20vmin, 150px);
  color: #fff; text-shadow: 0 5px 0 rgba(0,0,0,0.2), 0 0 34px rgba(255,255,255,0.7); letter-spacing: 3px;
}
#freeze-flake { font-size: clamp(40px, 12vmin, 90px); }
@keyframes freezePop { 0% { transform: scale(0.2) rotate(-12deg); } 60% { transform: scale(1.14) rotate(4deg); } 100% { transform: scale(1) rotate(0); } }
@keyframes freezeSoft { 0% { opacity: 0; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }

/* Klar-knapp */
#done-btn {
  position: fixed; z-index: 5; right: 16px; bottom: calc(16px + var(--safe-bottom));
  font-family: var(--font-heading); font-weight: 700; border: none; border-radius: 24px;
  padding: 14px 26px; font-size: clamp(16px, 4.4vmin, 20px); cursor: pointer;
  color: #10302d; background: var(--yellow); box-shadow: 0 5px 0 #C9A400, 0 4px 14px rgba(0,0,0,0.25);
}
#done-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #C9A400; }
#done-btn:focus-visible { outline: 4px solid #fff; outline-offset: 3px; }

/* ── SLUTSKÄRM ── */
#screen-end { justify-content: center; gap: clamp(12px, 3vmin, 22px); text-align: center; padding-left: max(18px, var(--safe-left)); padding-right: max(18px, var(--safe-right)); }
#screen-end h2 { font-family: var(--font-heading); font-weight: 700; font-size: clamp(30px, 8.4vmin, 56px); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,0.18), 0 0 22px rgba(255,255,255,0.45); }
#end-stars { font-size: clamp(34px, 10vmin, 68px); line-height: 1.1; min-height: 1.1em; }
#end-msg { font-size: clamp(16px, 4.2vmin, 22px); color: #fff; max-width: 380px; line-height: 1.5; font-weight: 500; text-shadow: 0 1px 4px rgba(0,0,0,0.22); }
#end-msg strong { color: var(--yellow); }
.end-row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
.end-btn { font-family: var(--font-heading); font-weight: 700; border: none; border-radius: 24px; padding: 14px 26px; font-size: clamp(16px, 4.4vmin, 20px); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
.end-btn.again { color: #10302d; background: var(--yellow); box-shadow: 0 5px 0 #C9A400; }
.end-btn.more { color: #fff; background: rgba(255,255,255,0.16); border: 2px solid rgba(255,255,255,0.5); }
.end-btn:active { transform: translateY(3px); }
.end-btn:focus-visible { outline: 4px solid #fff; outline-offset: 3px; }

/* Konfetti (delas av frys-firande + slut) */
.confetti { position: fixed; top: -20px; width: 12px; height: 16px; border-radius: 3px; z-index: 7; pointer-events: none; will-change: transform; }
.confetti.go { animation: confFall var(--cd,2.6s) linear forwards; }
@keyframes confFall { 0% { transform: translateY(0) rotate(0); opacity: 1; } 100% { transform: translateY(115vh) rotate(720deg); opacity: 0.9; } }

@media (prefers-reduced-motion: reduce) {
  #menu-bug, #menu-bug.wave, .wheel-ring.spin, .wheel-ring.r2.spin,
  #hero-spot.dancing, #hero-spot.dancing.calm { animation: none !important; }
}
</style>
</head>
<body>

<div class="bg"></div>

<!-- ── MENY ── -->
<div id="screen-menu" class="screen active">
  <div class="spotlight">
    <img id="menu-bug" src="/bilder/dansbacillen.png" alt="Dansbacillen redo att dansa" onclick="menuTap()">
  </div>
  <h1>Dansa med Dansbacillen</h1>
  <p id="menu-msg">Snurra hjulet, få en rolig dans och dansa loss. När musiken stannar fryser du. Alla kan vara med!</p>
  <div class="mode-row" role="group" aria-label="Välj läge">
    <button class="mode-btn" id="mode-standard" onclick="pickMode('standard')" aria-pressed="true">
      Standard<span class="m-sub">Fart och rörelse</span>
    </button>
    <button class="mode-btn" id="mode-lugnt" onclick="pickMode('lugnt')" aria-pressed="false">
      Lugnt läge<span class="m-sub">Mjukt och stillsamt</span>
    </button>
  </div>
  <button class="start-btn" onclick="startGame()">Starta dansen ▶</button>
  <a href="/spel.html" id="menu-more">🎮 Fler spel</a>
</div>

<!-- ── SPEL ── -->
<div id="screen-game" class="screen">
  <div id="hud">
    <button class="hud-btn" onclick="goMenu()" aria-label="Tillbaka till start">←</button>
    <div id="meter">
      <div id="meter-label">Dansmätaren</div>
      <div id="dots" aria-hidden="true"></div>
      <div id="stars" aria-label="Dansstjärnor"></div>
    </div>
    <button class="hud-btn" id="mute-btn" onclick="toggleMute()" aria-label="Ljud på eller av">🔊</button>
  </div>

  <div id="stage">
    <div id="hero-spot"><img id="hero" src="/bilder/dansbacillen.png" alt="Dansbacillen dansar"></div>
  </div>

  <div id="play-area">
    <div id="wheel-wrap">
      <div class="wheel-ring"></div>
      <div class="wheel-ring r2"></div>
      <div id="wheel-card">
        <div id="card-emoji">💃</div>
        <div id="card-name">Redo?</div>
      </div>
    </div>
    <div id="instruction">Snurrar hjulet…</div>
  </div>

  <button id="done-btn" onclick="finishGame()">Klar ✓</button>
</div>

<!-- FRYS-overlay -->
<div id="freeze">
  <div id="freeze-flake">❄️</div>
  <div id="freeze-txt">FRYS!</div>
</div>

<!-- ── SLUTSKÄRM ── -->
<div id="screen-end" class="screen">
  <div id="end-stars">🎉</div>
  <h2>Vilken dans!</h2>
  <p id="end-msg">Du dansade jättebra!</p>
  <div class="end-row">
    <button class="end-btn again" onclick="goMenu()">Dansa igen ▶</button>
    <a class="end-btn more" href="/spel.html">🎮 Fler spel</a>
  </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ══════════════ RÖRELSER (exakt text, inga tankstreck) ══════════════ */
const STANDARD = [
  { key:'spagetti',    emoji:'🍝',  name:'Spagettidansen',  text:'Dansa som kokt spagetti! Sladdrig i hela kroppen!' },
  { key:'robot',       emoji:'🤖',  name:'Robotdansen',     text:'Dansa som en robot! Stela armar, hackiga rörelser!' },
  { key:'snigel',      emoji:'🐌',  name:'Snigeldansen',    text:'Dansa jättelångsamt som en snigel!' },
  { key:'blixt',       emoji:'⚡',  name:'Blixtdansen',     text:'Dansa supersnabbt! Snabbare än blixten!' },
  { key:'enarm',       emoji:'💪',  name:'Enarmsdansen',    text:'Dansa med bara ena armen! Resten av kroppen står still!' },
  { key:'groda',       emoji:'🐸',  name:'Grodhoppet',      text:'Hoppa och dansa som en groda!' },
  { key:'snurr',       emoji:'🌀',  name:'Snurredansen',    text:'Snurra runt, runt, runt!' },
  { key:'staty',       emoji:'🗿',  name:'Statydansen',     text:'Dansa som en staty som just vaknat till liv!' },
  { key:'jatte',       emoji:'🦖',  name:'Jättedansen',     text:'Dansa som en jättestor dinosaurie! Stora tunga steg!' },
  { key:'mus',         emoji:'🐭',  name:'Musdansen',       text:'Dansa pytteliten som en mus! Små, små rörelser!' },
  { key:'tvattmaskin', emoji:'🌪️', name:'Tvättmaskinen',   text:'Dansa som en tvättmaskin på centrifugering!' },
  { key:'ballong',     emoji:'🎈',  name:'Ballongdansen',   text:'Dansa som en ballong som svävar upp mot taket!' },
  { key:'katt',        emoji:'🐱',  name:'Kattdansen',      text:'Smyg mjukt och sträck dig som en katt!' },
  { key:'bebis',       emoji:'👶',  name:'Bebisdansen',     text:'Krypa och vagga som en liten bebis!' },
  { key:'regn',        emoji:'🌧️', name:'Regndansen',      text:'Vifta fingrarna som regn och plaska i pölarna!' },
  { key:'sol',         emoji:'☀️',  name:'Soldansen',       text:'Sträck armarna vitt ut och lys som solen!' },
  { key:'sim',         emoji:'🏊',  name:'Simdansen',       text:'Simma genom luften med stora simtag!' },
  { key:'fagel',       emoji:'🐦',  name:'Fågeldansen',     text:'Flaxa med armarna som vingar och flyg som en fågel!' },
  { key:'popcorn',     emoji:'🍿',  name:'Popcorndansen',   text:'Sitt ihopkrupen och poppa upp som popcorn!' },
  { key:'superhjalte', emoji:'🦸',  name:'Superhjältedansen', text:'Flyg och posera som en superhjälte!' },
  { key:'pingvin',     emoji:'🐧',  name:'Pingvindansen',   text:'Vagga från sida till sida som en pingvin!' },
  { key:'raket',       emoji:'🚀',  name:'Raketdansen',     text:'Räkna ner… tre, två, ett… och skjut upp i luften!' },
  { key:'disco',       emoji:'🕺',  name:'Discodansen',     text:'Peka upp mot taket, en arm i taget!' }
];
const LUGNT = [
  { key:'finger',  emoji:'🖐️', name:'Fingerdansen',    text:'Låt bara fingrarna dansa!' },
  { key:'ansikte', emoji:'😜',  name:'Ansiktsdansen',   text:'Dansa med ansiktet! Ögonbryn, mun och näsa!' },
  { key:'axel',    emoji:'🤷',  name:'Axeldansen',      text:'Låt axlarna dansa upp och ner!' },
  { key:'huvud',   emoji:'🎵',  name:'Huvudgungan',     text:'Gunga huvudet mjukt i takt!' },
  { key:'tadans',  emoji:'🦶',  name:'Tådansen',        text:'Sitt still och låt bara tårna dansa!' },
  { key:'andning', emoji:'🌬️', name:'Andningsdansen',  text:'Andas in, sträck dig långsamt, andas ut och sjunk ihop!' },
  { key:'trott',    emoji:'😴',  name:'Tröttdansen',    text:'Sträck dig, gäspa stort och dansa jättesömnigt!' },
  { key:'ogon',     emoji:'👀',  name:'Ögondansen',     text:'Håll kroppen still och låt bara ögonen dansa runt!' },
  { key:'vinka',    emoji:'👋',  name:'Vinkdansen',     text:'Vinka mjukt och långsamt med händerna!' },
  { key:'kattstrack', emoji:'🐈', name:'Kattsträckningen', text:'Sträck dig långsamt och mysigt som en katt!' },
  { key:'vag',      emoji:'🌊',  name:'Vågdansen',      text:'Gör mjuka vågor med armarna, som havet!' },
  { key:'mane',     emoji:'🌙',  name:'Månpromenaden',  text:'Gå superlångsamt, som på månen!' }
];
const CHEERS = ['hejarop-1','hejarop-2','hejarop-3','hejarop-4'];

/* ══════════════ RÖSTKLIPP (mp3, egna ElevenLabs) ══════════════
   Preload vid spelstart. Fallback: saknat/ej laddat klipp -> texten visas
   ändå, spelet fortsätter utan fel. Mute hålls bara i minnet. */
const VOICE = {};
let voiceLoaded = false, clipsWarmed = false;
function mkClip(src) { const a = new Audio(src); a.preload = 'auto'; return a; }
function loadVoices() {
  if (voiceLoaded) return;
  voiceLoaded = true;
  STANDARD.concat(LUGNT).forEach(m => { VOICE[m.key] = mkClip('/ljud/dans/' + m.key + '.mp3'); });
  CHEERS.forEach(c => { VOICE[c] = mkClip('/ljud/dans/' + c + '.mp3'); });
  VOICE.valkommen = mkClip('/ljud/dans/valkommen.mp3');
  VOICE.avslut    = mkClip('/ljud/dans/avslut.mp3');
  VOICE.frys      = mkClip('/ljud/dans/frys.mp3');
}
function warmClips() {
  if (clipsWarmed || !voiceLoaded) return;
  clipsWarmed = true;
  // iOS: lås upp varje klipp i användargesten men producera INGET ljud.
  // Mutat + synkron paus = tyst även om iOS ignorerar antingen muted eller pausen.
  // Klippen förblir mutade; playClip slår på ljud bara för klippet som ska spelas.
  Object.values(VOICE).forEach(a => {
    try {
      a.muted = true;
      const p = a.play();
      if (p && p.catch) p.catch(() => {});
      a.pause();
      a.currentTime = 0;
    } catch (e) {}
  });
}
function playClip(key) {
  if (muted) return;
  const a = VOICE[key];
  if (!a) return;                       // saknas -> tyst, spelet fortsätter
  try { a.muted = false; a.currentTime = 0; const p = a.play(); if (p) p.catch(() => {}); } catch (e) {}
}
function randomCheer() { return CHEERS[Math.floor(Math.random() * CHEERS.length)]; }

/* ══════════════ WEB AUDIO — genererad musik (inga ljudfiler för musik) ══════════════ */
let audioCtx = null, masterGain = null, musicGain = null, noiseBuf = null;
let muted = false;

function initAudio() {
  if (audioCtx) { if (audioCtx.state === 'suspended') audioCtx.resume(); return; }
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain(); masterGain.gain.value = muted ? 0 : 1; masterGain.connect(audioCtx.destination);
  musicGain = audioCtx.createGain(); musicGain.gain.value = 0; musicGain.connect(masterGain);
  const len = audioCtx.sampleRate * 0.5;
  noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

const NOTE = { C4:261.63, D4:293.66, E4:329.63, G4:392.00, A4:440.00, C5:523.25, D5:587.33, E5:659.25, G5:784.00, A5:880.00 };

/* Flera "låtar": varje runda väljs en slumpad melodi (+ eget tempo) så att det
   låter som olika sånger. Aldrig samma låt två gånger i rad (pickSong). */
const SONGS_STD = [
  { bpm:116, mel:[NOTE.C5, NOTE.E5, NOTE.G5, NOTE.E5, NOTE.A5, NOTE.G5, NOTE.E5, NOTE.D5, NOTE.C5, NOTE.E5, NOTE.D5, NOTE.G4] },
  { bpm:120, mel:[NOTE.G4, NOTE.A4, NOTE.C5, NOTE.D5, NOTE.E5, NOTE.D5, NOTE.C5, NOTE.A4, NOTE.G4, NOTE.A4, NOTE.C5, NOTE.E5] },
  { bpm:108, mel:[NOTE.C5, NOTE.D5, NOTE.E5, NOTE.G5, NOTE.A5, NOTE.G5, NOTE.E5, NOTE.D5, NOTE.C5, NOTE.G4, NOTE.A4, NOTE.C5] },
  { bpm:124, mel:[NOTE.E5, NOTE.G5, NOTE.A5, NOTE.G5, NOTE.E5, NOTE.D5, NOTE.C5, NOTE.D5, NOTE.E5, NOTE.G5, NOTE.E5, NOTE.C5] },
  { bpm:112, mel:[NOTE.A4, NOTE.C5, NOTE.D5, NOTE.E5, NOTE.G5, NOTE.E5, NOTE.D5, NOTE.C5, NOTE.A4, NOTE.G4, NOTE.A4, NOTE.C5] }
];
const SONGS_CALM = [
  { bpm:80, mel:[NOTE.C5, NOTE.E5, NOTE.G4, NOTE.A4, NOTE.G4, NOTE.E5, NOTE.D5, NOTE.C5] },
  { bpm:72, mel:[NOTE.E5, NOTE.D5, NOTE.C5, NOTE.D5, NOTE.E5, NOTE.E5, NOTE.D5, NOTE.C5] },
  { bpm:76, mel:[NOTE.G4, NOTE.A4, NOTE.C5, NOTE.E5, NOTE.D5, NOTE.C5, NOTE.A4, NOTE.G4] },
  { bpm:70, mel:[NOTE.C5, NOTE.D5, NOTE.E5, NOTE.G5, NOTE.E5, NOTE.D5, NOTE.C5, NOTE.G4] }
];
const BASS = [NOTE.C4, NOTE.G4, NOTE.A4, NOTE.G4];
let curMel = SONGS_STD[0].mel, lastSongIdx = -1;
function pickSong() {
  const bank = (mode === 'lugnt') ? SONGS_CALM : SONGS_STD;
  let i;
  do { i = Math.floor(Math.random() * bank.length); }
  while (bank.length > 1 && i === lastSongIdx);
  lastSongIdx = i;
  return bank[i];
}

function tone(freq, t, dur, peak, type) {
  const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(musicGain); o.start(t); o.stop(t + dur + 0.02);
}
function kick(t) {
  const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(48, t + 0.14);
  g.gain.setValueAtTime(0.42, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
  o.connect(g); g.connect(musicGain); o.start(t); o.stop(t + 0.18);
}
function hat(t) {
  const n = audioCtx.createBufferSource(); n.buffer = noiseBuf;
  const hp = audioCtx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 8000;
  const g = audioCtx.createGain(); g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
  n.connect(hp); hp.connect(g); g.connect(musicGain); n.start(t); n.stop(t + 0.05);
}

/* ── Musik-tillstånd + schemaläggare ──
   Två tempon: Standard snabbare, Lugnt långsammare. Det slumpade stoppet
   (15–30 s) implementeras HÄR i schemaläggaren (stopAtCtxTime). */
let cfg = null;                          // { busy:bool, bpm:int }
let musicOn = false, stepDur = 0.25, nextNoteTime = 0, noteIdx = 0, melIdx = 0;
let stopAtCtxTime = 0, schedTimer = null;

const MODE = {
  standard: { busy: true,  bpm: 116 },
  lugnt:    { busy: false, bpm: 80  }
};

function startMusic() {
  cfg = MODE[mode];
  const song = pickSong();               // slumpad låt varje runda
  curMel = song.mel;
  stepDur = (60 / song.bpm) / 2;         // åttondelar
  noteIdx = 0; melIdx = 0;
  nextNoteTime = audioCtx.currentTime + 0.08;
  // slumpad danslängd 15–30 s -> stopp läggs i schemaläggaren
  const danceLen = 15 + Math.random() * 15;
  stopAtCtxTime = nextNoteTime + danceLen;
  musicGain.gain.cancelScheduledValues(audioCtx.currentTime);
  musicGain.gain.setValueAtTime(0.9, audioCtx.currentTime);   // höjd så musiken hörs på små surfplattehögtalare
  musicOn = true;
  clearInterval(schedTimer);
  schedTimer = setInterval(musicScheduler, 25);
}

function musicScheduler() {
  if (!musicOn || !audioCtx) return;
  const now = audioCtx.currentTime;
  if (now >= stopAtCtxTime) { stopMusicIntoFreeze(); return; }   // det plötsliga stoppet
  while (nextNoteTime < now + 0.15 && nextNoteTime < stopAtCtxTime) {
    scheduleStep(noteIdx, nextNoteTime);
    noteIdx++;
    nextNoteTime += stepDur;
  }
}

function scheduleStep(i, t) {
  if (cfg.busy) {
    if (i % 2 === 0) kick(t);                                   // slag varje fjärdedel
    hat(t);                                                     // hihat varje åttondel
    tone(curMel[i % curMel.length], t, 0.20, 0.18, 'triangle');
    if (i % 4 === 0) tone(BASS[(i / 4) % BASS.length] / 2, t, 0.34, 0.13, 'sine');
  } else {
    if (i % 4 === 0) kick(t);                                   // glesare, lugnare
    if (i % 2 === 0) { tone(curMel[melIdx % curMel.length], t, 0.5, 0.16, 'sine'); melIdx++; }
    if (i % 8 === 0) tone(BASS[(i / 8) % BASS.length] / 2, t, 0.7, 0.11, 'sine');
  }
}

function stopMusicIntoFreeze() {
  musicOn = false;
  clearInterval(schedTimer); schedTimer = null;
  const now = audioCtx.currentTime;
  if (mode === 'lugnt') {
    // mjukare frysmoment: toning i stället för tvärstopp
    musicGain.gain.cancelScheduledValues(now);
    musicGain.gain.setValueAtTime(musicGain.gain.value, now);
    musicGain.gain.linearRampToValueAtTime(0.0001, now + 1.2);
    freeze(true);
  } else {
    // Standard: plötsligt stopp
    musicGain.gain.cancelScheduledValues(now);
    musicGain.gain.setTargetAtTime(0.0001, now, 0.02);
    freeze(false);
  }
}

/* FRYS-ljud (Web Audio, ingen fil). Routas via masterGain (mute-medvetet) och
   INTE via musicGain — det tonas ju ner vid frysen. Standard: snärtigt nedåtsvep
   plus iskrasch. Lugnt: mjuk klingande shimmer som matchar det mjukare stoppet. */
function freezeSound(soft) {
  if (!audioCtx || !masterGain) return;
  const t = audioCtx.currentTime;
  if (soft) {
    [NOTE.G5, NOTE.E5, NOTE.C5].forEach((f, i) => {
      const dt = t + i * 0.07;
      const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(f, dt);
      g.gain.setValueAtTime(0.0001, dt);
      g.gain.exponentialRampToValueAtTime(0.16, dt + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, dt + 0.95);
      o.connect(g); g.connect(masterGain); o.start(dt); o.stop(dt + 1.0);
    });
  } else {
    // nedåtsvep (zap)
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(900, t);
    o.frequency.exponentialRampToValueAtTime(90, t + 0.28);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.22, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    o.connect(g); g.connect(masterGain); o.start(t); o.stop(t + 0.32);
    // iskrasch (kort ljust brusknäpp)
    const n = audioCtx.createBufferSource(); n.buffer = noiseBuf;
    const bp = audioCtx.createBiquadFilter(); bp.type = 'highpass'; bp.frequency.value = 5000;
    const gn = audioCtx.createGain(); gn.gain.setValueAtTime(0.2, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    n.connect(bp); bp.connect(gn); gn.connect(masterGain); n.start(t); n.stop(t + 0.14);
    // liten sparkle på slutet
    const s = audioCtx.createOscillator(); const sg = audioCtx.createGain();
    s.type = 'sine'; s.frequency.setValueAtTime(NOTE.C5, t + 0.27);
    sg.gain.setValueAtTime(0.0001, t + 0.27);
    sg.gain.exponentialRampToValueAtTime(0.13, t + 0.30);
    sg.gain.exponentialRampToValueAtTime(0.0001, t + 0.62);
    s.connect(sg); sg.connect(masterGain); s.start(t + 0.27); s.stop(t + 0.64);
  }
}

/* ══════════════ SPELFLÖDE ══════════════ */
let mode = reduce ? 'lugnt' : 'standard';   // prefers-reduced-motion -> Lugnt som förval
let pool = STANDARD, currentMove = null, lastKey = null;
let state = 'idle';                          // idle | wheel | dancing | freeze | end
let freezeTimer = null, danceTurns = 0;

/* Dansmätaren */
const METER = 6;
let dotsFilled = 0, stars = 0, totalDances = 0;

function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); $(id).classList.add('active'); }
function setInstruction(t) { $('instruction').textContent = t; }
function setCard(m) { $('card-emoji').textContent = m.emoji; $('card-name').textContent = m.name; }

function pickMode(m) {
  mode = m;
  $('mode-standard').classList.toggle('sel', m === 'standard');
  $('mode-lugnt').classList.toggle('sel', m === 'lugnt');
  $('mode-standard').setAttribute('aria-pressed', m === 'standard');
  $('mode-lugnt').setAttribute('aria-pressed', m === 'lugnt');
}

function buildMeter() {
  const d = $('dots'); d.innerHTML = '';
  for (let i = 0; i < METER; i++) { const el = document.createElement('div'); el.className = 'dot'; d.appendChild(el); }
  $('stars').innerHTML = '';
  dotsFilled = 0; stars = 0; totalDances = 0;
}
function meterStep() {
  totalDances++;
  const dot = $('dots').children[dotsFilled];
  if (dot) { dot.classList.add('filled', 'pop'); setTimeout(() => dot.classList.remove('pop'), 360); }
  dotsFilled++;
  if (dotsFilled >= METER) {
    stars++;
    const st = document.createElement('span'); st.className = 'star pop'; st.textContent = '⭐';
    $('stars').appendChild(st);
    confettiBurst(reduce ? 12 : 30);
    // nollställ pricktavlan för nästa varv (mätaren tar aldrig slut)
    setTimeout(() => { [...$('dots').children].forEach(x => x.classList.remove('filled')); dotsFilled = 0; }, 500);
  }
}

function startGame() {
  initAudio();
  loadVoices();
  warmClips();
  pool = (mode === 'lugnt') ? LUGNT : STANDARD;
  lastKey = null; danceTurns = 0; state = 'idle';
  buildMeter();
  show('screen-game');
  $('mute-btn').textContent = muted ? '🔇' : '🔊';
  playClip('valkommen');
  setTimeout(spinWheel, 900);            // liten stund efter välkomsthälsningen
}

/* Slumpa rörelse — aldrig samma två gånger i rad */
function pickMove() {
  let m;
  do { m = pool[Math.floor(Math.random() * pool.length)]; }
  while (pool.length > 1 && m.key === lastKey);
  lastKey = m.key;
  return m;
}

/* Hjulet snurrar och stannar på en slumpad rörelse.
   prefers-reduced-motion: snurr ersätts av kort övertoning (funktionellt likvärdigt). */
function spinWheel() {
  if (state === 'end') return;
  state = 'wheel';
  hideFreeze();
  setHero('idle');
  const move = pickMove();
  currentMove = move;
  setInstruction('Snurrar hjulet…');

  if (reduce) {
    const card = $('wheel-card');
    card.classList.add('fade');
    setTimeout(() => {
      setCard(move); card.classList.remove('fade'); card.classList.add('land');
      setTimeout(() => card.classList.remove('land'), 500);
      afterWheel(move);
    }, 480);
    return;
  }

  document.querySelectorAll('.wheel-ring').forEach(r => r.classList.add('spin'));
  let ticks = 0; const total = 15;
  (function cycle() {
    if (state !== 'wheel') return;
    if (ticks >= total) {
      document.querySelectorAll('.wheel-ring').forEach(r => r.classList.remove('spin'));
      setCard(move);
      const card = $('wheel-card'); card.classList.add('land');
      setTimeout(() => card.classList.remove('land'), 500);
      afterWheel(move);
      return;
    }
    setCard(pool[Math.floor(Math.random() * pool.length)]);   // flimrar förbi olika danser
    ticks++;
    setTimeout(cycle, 60 + ticks * ticks * 1.4);              // bromsar in
  })();
}

/* Rörelsen visas som text + emoji, röstklippet spelas, sedan startar musiken. */
function afterWheel(move) {
  setCard(move);
  setInstruction(move.emoji + ' ' + move.text);
  playClip(move.key);
  setTimeout(() => { if (state === 'wheel') startDance(); }, 1300);
}

function startDance() {
  state = 'dancing';
  setHero('dancing');
  startMusic();                          // stoppet (15–30 s) sköts i schemaläggaren
}

function setHero(s) {
  const spot = $('hero-spot');
  spot.classList.remove('dancing', 'calm', 'frozen');
  if (s === 'dancing') { spot.classList.add('dancing'); if (mode === 'lugnt') spot.classList.add('calm'); }
  else if (s === 'frozen') { spot.classList.add('frozen'); }
}

/* FRYS-moment: 3 sekunder, Dansbacillen står stilla. */
function freeze(soft) {
  state = 'freeze';
  setHero('frozen');
  freezeSound(soft);                     // FRYS-ljudeffekt exakt när texten dyker upp
  playClip('frys');                      // Dansbacillen ropar "FRYS!" (saknas -> tyst, texten visas ändå)
  const f = $('freeze');
  f.className = 'show ' + (soft ? 'soft' : 'pop');
  setInstruction('');
  clearTimeout(freezeTimer);
  freezeTimer = setTimeout(freezeEnd, 3000);
}
function hideFreeze() { $('freeze').className = ''; }

/* Efter frysen: hejarop + dansmätaren fylls ett steg, sedan tillbaka till hjulet. */
function freezeEnd() {
  if (state !== 'freeze') return;
  hideFreeze();
  playClip(randomCheer());
  meterStep();
  danceTurns++;
  setInstruction('Bra dansat! 🎉');
  setTimeout(() => { if (state === 'freeze' || state === 'wheel' || state === 'dancing') spinWheel(); }, 900);
  state = 'wheel';                       // spärrar dubbelkörning tills spinWheel tar över
}

/* ══════════════ AVSLUTA / NAVIGERA ══════════════ */
function stopAll() {
  musicOn = false;
  clearInterval(schedTimer); schedTimer = null;
  clearTimeout(freezeTimer); freezeTimer = null;
  if (audioCtx && musicGain) { musicGain.gain.cancelScheduledValues(audioCtx.currentTime); musicGain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.02); }
  document.querySelectorAll('.wheel-ring').forEach(r => r.classList.remove('spin'));
  hideFreeze();
  setHero('idle');
}

/* "Klar" -> slutskärm. Dansmätaren firas oavsett antal rundor. */
function finishGame() {
  stopAll();
  state = 'end';
  const s = $('end-stars');
  s.textContent = stars > 0 ? '⭐'.repeat(Math.min(stars, 8)) : '🎉';
  let msg;
  if (totalDances === 0)      msg = 'Du är redo att dansa! Kom tillbaka när du vill.';
  else if (totalDances === 1) msg = 'Du dansade <strong>1</strong> dans. Vilken stjärna!';
  else                        msg = 'Du dansade <strong>' + totalDances + '</strong> danser. Vilken dansare du är!';
  $('end-msg').innerHTML = msg;
  show('screen-end');
  playClip('avslut');
  confettiBurst(reduce ? 16 : 46);
}

function goMenu() {
  stopAll();
  state = 'idle';
  show('screen-menu');
}

/* ══════════════ LJUD PÅ/AV (endast i minnet, ingen lagring) ══════════════ */
function toggleMute() {
  muted = !muted;
  if (masterGain && audioCtx) masterGain.gain.setTargetAtTime(muted ? 0 : 1, audioCtx.currentTime, 0.02);
  Object.values(VOICE).forEach(a => { a.muted = muted; if (muted) { try { a.pause(); } catch (e) {} } });
  $('mute-btn').textContent = muted ? '🔇' : '🔊';
}

/* ══════════════ ÖVRIGT ══════════════ */
function confettiBurst(n) {
  const cols = ['#4ECDC4', '#FF6B6B', '#FFD93D', '#B57EDC', '#7BC142', '#FF8AC4', '#ffffff'];
  for (let i = 0; i < n; i++) {
    const c = document.createElement('div'); c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = cols[i % cols.length];
    c.style.setProperty('--cd', (2.1 + Math.random() * 1.6).toFixed(2) + 's');
    if (Math.random() < 0.5) c.style.borderRadius = '50%';
    document.body.appendChild(c);
    requestAnimationFrame(() => c.classList.add('go'));
    setTimeout(() => c.remove(), 4200);
  }
}

function menuTap() {
  const b = $('menu-bug'); b.classList.remove('wave'); void b.offsetWidth; b.classList.add('wave');
  initAudio(); loadVoices(); warmClips();
}

pickMode(mode);   // markera förvalt läge (Lugnt om reduced-motion)
['pointerdown', 'touchstart', 'click'].forEach(ev => window.addEventListener(ev, warmClips, { passive: true }));
document.addEventListener('visibilitychange', () => { if (!document.hidden && audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); });
</script>
