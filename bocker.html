<!DOCTYPE html>
<html lang="sv">
<head>
<script src="/app-mode.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Böcker – kommer snart | Bacillerna</title>
<meta name="description" content="Bacillernas böcker gör en paus just nu. Vi kommer tillbaka med något ännu finare snart.">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#7BC142">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<style>
/* Självhostade fonter — inga externa anrop (Google Play Families). */
@font-face { font-family: 'Fredoka'; src: url('/fonts/Fredoka-VariableFont.ttf') format('truetype'); font-weight: 300 700; font-display: swap; }
@font-face { font-family: 'Nunito'; src: url('/fonts/Nunito-VariableFont.ttf') format('truetype'); font-weight: 200 1000; font-display: swap; }
</style>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(160deg, #F4FBEF 0%, #E6F5DC 100%);
    color: #333;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .card {
    background: #fff;
    border-radius: 28px;
    box-shadow: 0 20px 60px rgba(45,134,89,0.15);
    padding: 48px 36px;
    max-width: 460px;
  }
  .emoji { font-size: 64px; line-height: 1; margin-bottom: 16px; }
  h1 {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    color: #2D8659;
    font-size: 30px;
    margin-bottom: 14px;
  }
  p { font-size: 17px; line-height: 1.6; color: #555; margin-bottom: 28px; }
  .btn {
    display: inline-block;
    font-family: 'Fredoka', sans-serif;
    font-weight: 500;
    background: #7BC142;
    color: #fff;
    text-decoration: none;
    padding: 14px 30px;
    border-radius: 999px;
    font-size: 17px;
    transition: transform .15s ease, background .15s ease;
  }
  .btn:hover { background: #6BB035; transform: translateY(-2px); }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">📚✨</div>
    <h1>Böckerna tar en liten paus</h1>
    <p>Vi bygger om vår böcker-sida för att göra den ännu finare. Titta gärna in igen snart – under tiden finns det massor att upptäcka på startsidan!</p>
    <a class="btn" href="/">Tillbaka till start</a>
  </div>
</body>
</html>
